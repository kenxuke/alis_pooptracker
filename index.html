<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Poop Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app-container">
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-badge">💩</div>
      <div>
        <h1>Ali's Poop Tracker</h1>
        <p>Tap to log time • Press & hold to view times</p>
      </div>
    </div>
    <button id="toggle-sidebar-btn" class="dashboard-btn" aria-label="Open Dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      <span>Stats</span>
    </button>
  </header>

  <main>
    <section class="card calendar-card">
      <div class="calendar-header">
        <button id="prev-month" class="nav-btn" aria-label="Previous Month">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span id="month-year-label"></span>
        <button id="next-month" class="nav-btn" aria-label="Next Month">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>
      <div class="calendar-grid" id="calendar-days">
        <div class="day-name">Sun</div>
        <div class="day-name">Mon</div>
        <div class="day-name">Tue</div>
        <div class="day-name">Wed</div>
        <div class="day-name">Thu</div>
        <div class="day-name">Fri</div>
        <div class="day-name">Sat</div>
      </div>
    </section>
  </main>
</div>

<!-- Sidebar Overlay -->
<div id="sidebar-overlay" class="sidebar-overlay"></div>

<!-- Slide-out Sidebar Dashboard -->
<aside id="analytics-sidebar" class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">
      <h2>Analytics</h2>
      <p>Monthly trends & daily counts</p>
    </div>
    <button id="close-sidebar-btn" class="close-btn" aria-label="Close Dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
  
  <div class="sidebar-content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-info">
          <div class="value" id="stat-total">0</div>
          <div class="label">Total This Month</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔥</div>
        <div class="stat-info">
          <div class="value" id="stat-streak">0</div>
          <div class="label">Day Streak</div>
        </div>
      </div>
    </div>

    <div class="chart-card">
      <h3>Weekly Breakdown</h3>
      <div class="chart-container">
        <canvas id="monthlyChart"></canvas>
      </div>
    </div>

    <div class="sidebar-footer">
      <button id="delete-all-btn" class="delete-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        <span>Delete All Data</span>
      </button>
    </div>
  </div>
</aside>

<!-- Time Details Modal -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Logged Times</h3>
      <button id="close-modal-btn" class="close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <ul id="time-list" class="time-list"></ul>
    </div>
    <div class="modal-footer">
      <button id="clear-day-btn" class="delete-btn">Reset Day Logs</button>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
